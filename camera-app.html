<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Nspira Camera - Photo Stamping</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 14px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: #16213e;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e94560;
        }
        .header h1 {
            font-size: 18px;
            color: #e94560;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-align: center;
        }

        .video-wrapper {
            position: relative;
            background: #0f0f23;
            border-radius: 14px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 3 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0; left: 0;
        }

        /* GPS stamp: shaded overlay so text stays readable on any photo */
        .live-stamp {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(32, 38, 46, 0.82) 0%, rgba(42, 48, 56, 0.88) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-top: 2.5px solid rgba(233, 69, 96, 0.98);
            padding: 9px 14px 12px;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .live-stamp .ls-company {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
            line-height: 1.25;
            margin-bottom: 5px;
            padding-right: 80px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.80);
        }
        .live-stamp .ls-company::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: #e94560;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .live-stamp .ls-address {
            font-size: 12px;
            color: #c9ddff;
            line-height: 1.4;
            margin-bottom: 5px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 3px rgba(0,0,0,0.80);
        }
        .live-stamp .ls-gps {
            font-size: 11.5px;
            color: #9ee06a;
            font-family: 'Courier New', monospace;
            margin-bottom: 4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.80);
        }
        .live-stamp .ls-time {
            font-size: 11.5px;
            color: #ffe37a;
            font-family: 'Courier New', monospace;
            padding-right: 100px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.80);
        }
        /* Serial number is intentionally NOT shown in the live UI.
           It is added only to the captured/downloaded image. */
        .live-stamp .ls-serial { display: none !important; }
        .live-stamp .ls-logo {
            position: absolute;
            bottom: 12px;
            right: 14px;
            width: 90px;
            height: auto;
            opacity: 1;
            display: block;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }

        .flash {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: white; opacity: 0; pointer-events: none; transition: opacity 0.1s;
            z-index: 10;
        }
        .flash.active { opacity: 0.8; }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .controls button {
            padding: 14px 10px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 0;
        }
        .btn-capture { background: #e94560; color: white; }
        .btn-capture:active { background: #c73652; transform: scale(0.98); }
        .btn-capture:disabled { background: #444; color: #888; cursor: not-allowed; }
        .btn-switch { background: #533483; color: white; }
        .btn-switch:active { background: #6a4b9e; }
        .btn-download { background: #0f3460; color: white; }
        .btn-download:active { background: #1a4a7a; }
        .btn-download:disabled { background: #444; color: #888; cursor: not-allowed; }

        .status-msg {
            margin-top: 10px;
            text-align: center;
            font-size: 12.5px;
            color: #888;
            padding: 8px;
            border-radius: 8px;
            background: #0f0f23;
            min-height: 30px;
        }
        .status-msg .ready { color: #4caf50; }
        .status-msg .error { color: #e94560; }
        .status-msg .warn { color: #ffb74d; }

        .preview-wrapper {
            margin-top: 12px;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e94560;
            position: relative;
        }
        .preview-wrapper img { width: 100%; display: block; }

        .ios-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .ios-overlay.active { display: flex; }
        .ios-overlay img { max-width: 100%; max-height: 65vh; border-radius: 12px; border: 2px solid #e94560; }
        .ios-overlay .hint {
            color: #fff; margin-top: 16px; font-size: 15px; text-align: center;
            line-height: 1.6;
        }
        .ios-overlay .hint strong { color: #ffd54f; }
        .ios-overlay .close-btn {
            margin-top: 16px; padding: 12px 30px; border-radius: 50px;
            background: #e94560; color: white; border: none;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .ios-overlay .action-row {
            display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; justify-content: center;
        }
        .ios-overlay .action-row button {
            padding: 12px 24px; border-radius: 50px; border: none;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .ios-overlay .btn-save { background: #4caf50; color: white; }

        @media (max-width: 400px) {
            .container { padding: 12px; }
            .header h1 { font-size: 15px; }
            .controls button { font-size: 12px; padding: 12px 6px; }
            .live-stamp .ls-company { font-size: 13px; padding-right: 70px; }
            .live-stamp .ls-address { font-size: 10.5px; }
            .live-stamp .ls-gps, .live-stamp .ls-time { font-size: 10px; }
            .live-stamp .ls-time { padding-right: 85px; }
            .live-stamp .ls-serial { font-size: 18px; }
            .live-stamp .ls-logo { width: 70px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Nspira Photo Stamping(By F&A)</h1>
        </div>

        <div class="video-wrapper" id="videoWrapper">
            <video id="video" autoplay playsinline muted></video>

            <div class="live-stamp" id="liveStamp">
                <div class="ls-company">Captured By Nspira Camera</div>
                <div class="ls-address" id="lsAddress">📍 Detecting address...</div>
                <div class="ls-gps" id="lsGps">Lat --.------°   Long --.------°</div>
                <div class="ls-time" id="lsTime">🕐 --/--/---- --:--:-- --</div>
                <img class="ls-logo" id="lsLogo" src="https://mynspira.in/assets/images/logo-light.png" alt="NSPIRA logo">
            </div>

            <div class="flash" id="flash"></div>
        </div>

        <div class="controls">
            <button class="btn-capture" id="captureBtn" disabled>📷 Capture</button>
            <button class="btn-switch" id="switchBtn">🔄 Switch</button>
            <button class="btn-download" id="downloadBtn" disabled>⬇️ Download</button>
        </div>

        <div class="status-msg" id="statusMsg">
            <span class="ready">✅ Camera ready</span>
        </div>

        <div class="preview-wrapper" id="previewWrapper">
            <img id="previewImage" alt="Captured preview" />
        </div>
    </div>

    <div class="ios-overlay" id="iosOverlay">
        <img id="iosOverlayImg" alt="Save this image" />
        <div class="hint">
            <strong>iOS Detected</strong><br />
            Long-press the image above and choose <strong>"Save to Photos"</strong><br />
            or tap <strong>Share</strong> to save/share.
        </div>
        <div class="action-row">
            <button class="btn-save" id="iosSaveBtn">💾 Share / Save</button>
            <button class="close-btn" id="iosCloseBtn">✕ Close</button>
        </div>
    </div>

        // ============================================================
        // Logo loader — now uses embedded data URI, always loads
        // ============================================================
        function loadLogo() {
            return new Promise((resolve) => {
                const img = new Image();
                // No crossOrigin needed for data URIs
                img.onload = () => {
                    logoImage = img;
                    logoReady = true;
                    console.log('✅ Logo loaded:', img.naturalWidth + 'x' + img.naturalHeight);
                    resolve(true);
                };
                img.onerror = (e) => {
                    console.error('❌ Logo failed to load!', e);
                    logoReady = false;
                    resolve(false);
                };
                img.src = CONFIG.logoDataUri;
            });
        }

        // ============================================================
        // Serial helpers
        // ============================================================
        function getNextSerialNumber() { return photoCount + 1; }

        function commitSerial() {
            if (serialCommitted) return;
            photoCount++;
            localStorage.setItem(CONFIG.lsSerialKey, String(photoCount));
            serialCommitted = true;
        }

        // ============================================================
        // Format date/time
        // ============================================================
        function formatDateTime12hr(now) {
            const d = now || new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const day = pad(d.getDate());
            const month = pad(d.getMonth() + 1);
            const year = d.getFullYear();
            let hours = d.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const minutes = pad(d.getMinutes());
            const seconds = pad(d.getSeconds());
            return `${day}/${month}/${year} ${hours}:${minutes}:${seconds} ${ampm}`;
        }

        function getTimezoneAbbr() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const parts = new Intl.DateTimeFormat('en-US', {
                    timeZoneName: 'short', timeZone: tz
                }).formatToParts(new Date());
                const tzPart = parts.find(p => p.type === 'timeZoneName');
                return tzPart ? tzPart.value : tz;
            } catch { return ''; }
        }

            } else {
                lsGps.textContent = 'Lat --.------°   Long --.------°';
            }

            lsTime.textContent = `🕐 ${formatDateTime12hr(now)} ${getTimezoneAbbr()}`;

            if (currentGPS.address && currentGPS.address !== 'Detecting address...') {
                lsAddress.textContent = `📍 ${currentGPS.address}`;
            } else {
                lsAddress.textContent = '📍 Detecting address...';
            }

            const addressReady = currentGPS.address &&
                                 currentGPS.address !== 'Detecting address...' &&
                                 currentGPS.address !== 'Address lookup failed' &&
                                 currentGPS.address !== 'Address unavailable in English';
            captureBtn.disabled = !(gpsReady && addressReady);
        }

        setInterval(updateUI, 1000);
        updateUI();

        // ============================================================
        // Reverse geocoding
        // ============================================================
        function isEnglishText(str) {
            if (!str) return false;
            return /^[\x00-\x7F\s,.\-#/()&'":;°]+$/.test(str);
        }

        function cleanPlaceName(value) {
            if (!value || typeof value !== 'string') return '';
            const clean = value.trim().replace(/\s+/g, ' ');
            if (!clean || !isEnglishText(clean)) return '';
            return clean;
        }

        function buildFullAddress(addr, displayName, placeName = '') {
            const parts = [];

            // Name of the exact mapped place/building is more useful than
            // generic address fields, so put it first.
            const place = cleanPlaceName(placeName);
            if (place) parts.push(place);

            const specific = [
                addr.building,
                addr.amenity,
                addr.institution,
                addr.university,
                addr.school,
                addr.college,
                addr.office,
                addr.shop,
                addr.hospital,
                addr.clinic,
                addr.hotel,
                addr.restaurant,
                addr.place_of_worship,
                addr.tourism,
                addr.leisure,
                addr.industrial,
                addr.commercial,
                addr.retail
            ];

            const generic = [
                addr.house_number,
                addr.road || addr.street || addr.pedestrian || addr.footway || addr.path,
                addr.neighbourhood || addr.suburb || addr.quarter,
                addr.city_district || addr.district || addr.borough,
                addr.city || addr.town || addr.village || addr.hamlet,
                addr.county,
                addr.state_district,
                addr.state,
                addr.postcode,
                addr.country
            ];

            const push = (v) => {
                if (v && typeof v === 'string' && v.trim() && isEnglishText(v)) {
                    const clean = v.trim().replace(/\s+/g, ' ');
                    if (!parts.some(p => p.toLowerCase() === clean.toLowerCase())) {
                        parts.push(clean);
                    }
                }
            };

            specific.forEach(push);
            generic.forEach(push);

            let result = parts.filter(Boolean).join(', ');

            // Fallback to the provider's complete display name.
            if (result.length < 20 && displayName && isEnglishText(displayName)) {
                result = displayName.trim();
            }

            return result || 'Location not found';
        }

        function getBestPlaceName(data) {
            if (!data) return '';

            const candidates = [
                data.name,
                data.namedetails && data.namedetails['name:en'],
                data.namedetails && data.namedetails.name,
                data.address && data.address.amenity,
                data.address && data.address.institution,
                data.address && data.address.university,
                data.address && data.address.school,
                data.address && data.address.college,
                data.address && data.address.building
            ];

            for (const value of candidates) {
                const clean = cleanPlaceName(value);
                // Do not use generic OSM type words as a "name".
                if (clean && !/^(building|school|college|university|hospital|clinic|office|shop|restaurant|hotel|amenity)$/i.test(clean)) {
                    return clean;
                }
            }
            return '';
        }

        // Optional OSM nearby-name fallback. This helps when the GPS point
        // lands on a road/entrance but a named institution/building is nearby.
        async function getNearbyPlaceName(lat, lng) {
            try {
                const query = `
                    [out:json][timeout:6];
                    (
                      nwr(around:80,${lat},${lng})["name"];
                      nwr(around:80,${lat},${lng})["name:en"];
                    );
                    out center tags;
                `;

                const url = 'https://overpass-api.de/api/interpreter?data=' +
                    encodeURIComponent(query);

                const response = await fetch(url, {
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) return '';

                const data = await response.json();
                const elements = Array.isArray(data.elements) ? data.elements : [];

                const priority = {
                    university: 1,
                    college: 1,
                    school: 1,
                    hospital: 1,
                    clinic: 1,
                    public_building: 2,
                    office: 2,
                    government: 2,
                    commercial: 3,
                    retail: 3,
                    shop: 3,
                    building: 4
                };

                const candidates = elements.map(el => {
                    const tags = el.tags || {};
                    const name = cleanPlaceName(tags['name:en'] || tags.name || '');
                    if (!name) return null;

                    const lat2 = el.lat ?? el.center?.lat;
                    const lon2 = el.lon ?? el.center?.lon;
                    if (typeof lat2 !== 'number' || typeof lon2 !== 'number') return null;

                    const type = tags.amenity || tags.office || tags.shop || tags.building || '';
                    const rank = priority[type] || 5;

                    const dLat = (lat2 - lat) * 111320;
                    const dLon = (lon2 - lng) * 111320 * Math.cos(lat * Math.PI / 180);
                    const distance = Math.sqrt(dLat * dLat + dLon * dLon);

                    return { name, distance, rank, type };
                }).filter(Boolean);

                candidates.sort((a, b) => {
                    if (a.rank !== b.rank) return a.rank - b.rank;
                    return a.distance - b.distance;
                });

                // Only use a nearby name when it is genuinely close.
                return candidates.length && candidates[0].distance <= 80
                    ? candidates[0].name
                    : '';
            } catch (err) {
                console.warn('Nearby place lookup failed:', err);
                return '';
            }
        }

        async function getLocationName(lat, lng) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&namedetails=1&extratags=1&accept-language=en`;

                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json',
                        'Accept-Language': 'en'
                    }
                });

                if (!response.ok) throw new Error(`Nominatim HTTP ${response.status}`);

                const data = await response.json();
                const placeName = getBestPlaceName(data);

                // First use the exact reverse-geocoded object.
                let address = buildFullAddress(
                    data.address || {},
                    data.display_name || '',
                    placeName
                );

                // If OSM did not return a named object, look for a nearby
                // named institution/building as a fallback.
                if (!placeName || !data.name) {
                    const nearbyName = await getNearbyPlaceName(lat, lng);
                    if (nearbyName) {
                        address = buildFullAddress(
                            data.address || {},
                            data.display_name || '',
                            nearbyName
                        );
                    }
                }

                currentGPS.address = address || 'Location not found';
            } catch (err) {
                console.warn('Reverse geocoding failed:', err);
                currentGPS.address = 'Address lookup failed';
            }

            updateUI();
            return currentGPS.address;
        }

        // ============================================================
        // Geolocation
        // ============================================================
        function startGeolocation() {
            if (!navigator.geolocation) {
                lsAddress.textContent = '📍 GPS not supported';
                return;
            }
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    currentGPS.lat = pos.coords.latitude;
                    currentGPS.lng = pos.coords.longitude;
                    currentGPS.accuracy = pos.coords.accuracy;
                    gpsReady = true;
                    updateUI();
                    await getLocationName(currentGPS.lat, currentGPS.lng);
                },
                () => {
                    lsAddress.textContent = '📍 Location unavailable';
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
            );

            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(
                async (pos) => {
                    const moved = currentGPS.lat !== null && (
                        Math.abs(pos.coords.latitude - currentGPS.lat) > 0.0003 ||
                        Math.abs(pos.coords.longitude - currentGPS.lng) > 0.0003
                    );
                    currentGPS.lat = pos.coords.latitude;
                    currentGPS.lng = pos.coords.longitude;
                    currentGPS.accuracy = pos.coords.accuracy;
                    if (!gpsReady) gpsReady = true;
                    updateUI();
                    if (moved) {
                        await getLocationName(currentGPS.lat, currentGPS.lng);
                    }
                },
                () => {},
                { enableHighAccuracy: true, maximumAge: 10000 }
            );
        }

        // ============================================================
        // Camera
        // ============================================================
        async function startCamera(faceMode) {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                const constraints = {
                    video: { facingMode: faceMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false,
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();
                statusMsg.innerHTML = `<span class="ready">✅ Camera ready (${faceMode === 'environment' ? 'Rear' : 'Front'})</span>`;
                return true;
            } catch (err) {
                statusMsg.innerHTML = `<span class="error">❌ Camera error: ${err.message}</span>`;
                return false;
            }
        }

        // ============================================================
        // Word-safe wrapping
        // ============================================================
        function wrapByCharBudget(text, charsPerLine, maxLines) {
            const words = String(text).split(/\s+/).filter(Boolean);
            const lines = [];
            let current = '';

            for (const word of words) {
                const candidate = current ? current + ' ' + word : word;
                if (candidate.length <= charsPerLine) {
                    current = candidate;
                } else {
                    if (current) lines.push(current);
                    current = word;
                }
            }
            if (current) lines.push(current);

            if (lines.length > maxLines) {
                const head = lines.slice(0, maxLines - 1);
                const tail = lines.slice(maxLines - 1).join(' ');
                const tailWords = tail.split(' ');
                let trimmed = '';
                for (const w of tailWords) {
                    const test = trimmed ? trimmed + ' ' + w : w;
                    if (test.length > charsPerLine) break;
                    trimmed = test;
                }
                if (trimmed !== tail) trimmed = trimmed.replace(/,?\s*$/, '') + '…';
                head.push(trimmed);
                return head;
            }
            return lines;
        }

        // ============================================================
        // Capture
        // ============================================================
        async function capturePhoto() {
            if (!stream) { alert('Camera not ready.'); return; }
            if (!gpsReady) { alert('Waiting for GPS location...'); return; }

            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 150);

            currentPhotoSerial = getNextSerialNumber();
            serialCommitted = false;
            const countLabel = `${CONFIG.countPrefix}${currentPhotoSerial}`;

            const now = new Date();
            const timestamp = formatDateTime12hr(now);
            const tzAbbr = getTimezoneAbbr();
            const lat = currentGPS.lat;
            const lng = currentGPS.lng;
            const address = currentGPS.address || 'Address unavailable';
            const latStr = lat !== null ? `${lat.toFixed(6)}°` : '--.------°';
            const lngStr = lng !== null ? `${lng.toFixed(6)}°` : '--.------°';

            const canvas = document.createElement('canvas');
            canvas.width = CONFIG.outputWidth;
            canvas.height = CONFIG.outputHeight;
            const ctx = canvas.getContext('2d');

            // Draw the camera image across the ENTIRE canvas first.
            // The GPS panel is now an overlay, so the photo remains visible behind it.
            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            const targetAR = canvas.width / canvas.height;
            const srcAR = vw / vh;

            let sx = 0, sy = 0, sWidth = vw, sHeight = vh;
            if (srcAR > targetAR) {
                sWidth = Math.round(vh * targetAR);
                sx = Math.round((vw - sWidth) / 2);
            } else {
                sHeight = Math.round(vw / targetAR);
                sy = Math.round((vh - sHeight) / 2);
            }
            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

            // Shaded GPS overlay: the photo remains visible, but the shade is strong enough
            // to keep every GPS/address line readable even on white or very bright photos.
            const stampHeight = Math.round(canvas.height * 0.20);
            const stampY = canvas.height - stampHeight;

            const stampBg = ctx.createLinearGradient(0, stampY, 0, canvas.height);
            stampBg.addColorStop(0, 'rgba(32, 38, 46, 0.82)');
            stampBg.addColorStop(1, 'rgba(42, 48, 56, 0.88)');
            ctx.fillStyle = stampBg;
            ctx.fillRect(0, stampY, canvas.width, stampHeight);

            // Subtle red accent line.
            ctx.strokeStyle = 'rgba(233,69,96,0.95)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, stampY);
            ctx.lineTo(canvas.width, stampY);
            ctx.stroke();

            // Compact layout: less empty space, tighter line spacing.
            const padX = Math.round(canvas.width * 0.04);
            const padTop = 7;
            const lineGap = 4;

            const fsCompany = 22;
            const fsAddress = 20;
            const fsGPS = 15;
            const fsTime = 15;
            const fsCount = 36;

let y = stampY + padTop;

// Reset shadow state first
ctx.shadowBlur = 0;
ctx.shadowOffsetX = 0;
ctx.shadowOffsetY = 0;

// --- Company line ---
ctx.textAlign = 'left';
ctx.textBaseline = 'top';
ctx.shadowColor = 'rgba(0,0,0,0.75)';
ctx.shadowBlur = 5;
ctx.shadowOffsetY = 1;
ctx.font = `bold ${fsCompany}px 'Arial', 'Helvetica', sans-serif`;
ctx.fillStyle = '#ffffff';
ctx.fillText(CONFIG.companyName, padX, y);
y += fsCompany + lineGap;

// --- Address: icon stays in its own column; every wrapped line starts straight ---
const iconX = padX;
const textX = padX + 24;
ctx.font = `${fsAddress}px 'Arial', 'Helvetica', sans-serif`;
ctx.fillStyle = '#dbe9ff';
ctx.shadowBlur = 4;
ctx.fillText('📍 ', iconX, y);
const addressLinesUsed = wrapByCharBudget(
    address,
    CONFIG.addressCharsPerLine,
    CONFIG.addressMaxLines
);
for (const line of addressLinesUsed) {
    ctx.fillText(line, textX, y);
    y += fsAddress + lineGap;
}

// --- GPS: aligned with the address text column ---
ctx.font = `${fsGPS}px 'Courier New', monospace`;
ctx.fillStyle = '#b6e86a';
ctx.shadowBlur = 4;
ctx.fillText('⌖ ', iconX, y);
ctx.fillText(`Lat ${latStr}   Long ${lngStr}`, textX, y);
y += fsGPS + lineGap;

// --- Time: icon stays in its own column; text starts at the same x as address/GPS ---
ctx.font = `${fsTime}px 'Courier New', monospace`;
ctx.fillStyle = '#ffe37a';
ctx.shadowBlur = 4;
ctx.fillText('🕐 ', iconX, y);
ctx.fillText(`${timestamp}  ${tzAbbr}`, textX, y);

// --- Serial (top right) ---
ctx.textAlign = 'right';
ctx.textBaseline = 'top';
ctx.shadowBlur = 5;
ctx.font = `bold ${fsCount}px 'Arial Black', 'Arial', sans-serif`;
ctx.fillStyle = 'rgba(255,215,0,0.70)';
ctx.fillText(countLabel, canvas.width - padX, stampY + padTop);

// --- Logo (bottom right) ---
ctx.shadowBlur = 0;
ctx.shadowOffsetX = 0;
ctx.shadowOffsetY = 0;
ctx.textAlign = 'right';
ctx.textBaseline = 'bottom';

const logoLw = 125;
const logoLh = 35;
const logoLx = canvas.width - padX - logoLw;
const logoLy = canvas.height - logoLh - 8;

if (logoReady && logoImage) {
    try {
        ctx.drawImage(logoImage, logoLx, logoLy, logoLw, logoLh);
        console.log('✅ Logo drawn');
    } catch (err) {
        console.error('❌ Logo draw failed:', err);
    }
} else {
    console.warn('⚠️ Logo NOT ready — drawing text fallback');
    ctx.font = `bold 20px 'Arial Black', Arial, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('NSPIRA', canvas.width - padX, canvas.height - 10);
}

            // ✅ Convert the canvas to a JPEG blob
            try {
                canvas.toBlob((blob) => {
                    if (!blob) {
                        statusMsg.innerHTML = `<span class="error">❌ Failed to capture image.</span>`;
                        return;
                    }
                    currentPhotoBlob = blob;
                    previewImage.src = URL.createObjectURL(blob);
                    previewWrapper.style.display = 'block';
                    downloadBtn.disabled = false;
                    statusMsg.innerHTML = `<span class="ready">✅ Captured.Press Download.</span>`;
                }, 'image/jpeg', 0.92);
            } catch (err) {
                statusMsg.innerHTML = `<span class="error">❌ Capture failed: ${err.message}</span>`;
            }
        }   

        // ============================================================
        // DB upload
        // ============================================================
        async function uploadToDatabase(blob, meta) {
            if (!CONFIG.dbUploadUrl) return { success: false, reason: 'no-endpoint' };
            try {
                const form = new FormData();
                form.append('photo', blob, meta.filename);
                form.append('serial', String(meta.serial));
                form.append('company', CONFIG.companyName);
                form.append('timestamp', meta.timestamp);
                form.append('latitude', meta.lat !== null ? String(meta.lat) : '');
                form.append('longitude', meta.lng !== null ? String(meta.lng) : '');
                form.append('address', meta.address);
                form.append('device', navigator.userAgent);

                const headers = {};
                if (CONFIG.dbApiKey) headers['Authorization'] = `Bearer ${CONFIG.dbApiKey}`;

                const res = await fetch(CONFIG.dbUploadUrl, { method: 'POST', headers, body: form });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json().catch(() => ({}));
                return { success: true, response: json };
            } catch (err) {
                return { success: false, reason: err.message };
            }
        }

        // ============================================================
        // Download
        // ============================================================
        async function downloadPhoto() {
            if (!currentPhotoBlob) return;

            const now = new Date();
            const ts = now.getFullYear() +
                String(now.getMonth() + 1).padStart(2, '0') +
                String(now.getDate()).padStart(2, '0') + '_' +
                String(now.getHours()).padStart(2, '0') +
                String(now.getMinutes()).padStart(2, '0') +
                String(now.getSeconds()).padStart(2, '0');
            const filename = `Nspira_${currentPhotoSerial}_${ts}.jpg`;

            commitSerial();

            if (isIOS || (isSafari && !window.MSStream)) {
                showIOSOverlay(filename);
            } else {
                try {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(currentPhotoBlob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(link.href), 1500);
                    statusMsg.innerHTML = `<span class="ready">✅ Downloaded: ${filename}</span>`;
                } catch (e) {
                    statusMsg.innerHTML = `<span class="warn">⚠️ Download issue — share fallback.</span>`;
                    showIOSOverlay(filename);
                }
            }

            const meta = {
                filename,
                serial: currentPhotoSerial,
                timestamp: formatDateTime12hr(now),
                lat: currentGPS.lat,
                lng: currentGPS.lng,
                address: currentGPS.address,
            };
            uploadToDatabase(currentPhotoBlob, meta).then((result) => {
                if (result.success) {
                    statusMsg.innerHTML += `<br /><span class="ready">☁️ Uploaded.</span>`;
                } else if (result.reason !== 'no-endpoint') {
                    statusMsg.innerHTML += `<br /><span class="warn">⚠️ DB upload failed.</span>`;
                }
            });

            setTimeout(() => {
                downloadBtn.disabled = true;
                previewWrapper.style.display = 'none';
                previewImage.src = '';
                currentPhotoBlob = null;
                serialCommitted = false;
                updateUI();
            }, 1500);
        }

        // ============================================================
        // iOS overlay
        // ============================================================
        function showIOSOverlay(filename) {
            iosOverlayImg.src = URL.createObjectURL(currentPhotoBlob);
            iosOverlay.dataset.filename = filename;
            iosOverlay.classList.add('active');
        }

        iosCloseBtn.addEventListener('click', () => {
            iosOverlay.classList.remove('active');
            if (iosOverlayImg.src) URL.revokeObjectURL(iosOverlayImg.src);
        });

        iosSaveBtn.addEventListener('click', async () => {
            if (!currentPhotoBlob) return;
            const filename = iosOverlay.dataset.filename || 'Nspira.jpg';
            const file = new File([currentPhotoBlob], filename, { type: 'image/jpeg' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: 'Nspira Photo' });
                    statusMsg.innerHTML = `<span class="ready">✅ Shared/saved.</span>`;
                } catch (e) { console.warn('Share cancelled:', e); }
            } else {
                alert('Long-press the image, then choose "Save to Photos".');
            }
        });

        // ============================================================
        // Reset
        // ============================================================
        async function resetSerial() {
            photoCount = 0;
            serialCommitted = false;
            localStorage.setItem(CONFIG.lsSerialKey, '0');
            updateUI();
            statusMsg.innerHTML = `<span class="ready">✅ Serial reset. Ready for next capture.</span>`;
        }
        window.nspiraReset = resetSerial;

        // ============================================================
        // Switch camera
        // ============================================================
        async function switchCamera() {
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            await startCamera(facingMode);
        }

        // ============================================================
        // Event listeners
        // ============================================================
        captureBtn.addEventListener('click', capturePhoto);
        downloadBtn.addEventListener('click', downloadPhoto);
        switchBtn.addEventListener('click', switchCamera);

        // ============================================================
        // Init
        // ============================================================
        async function init() {
            if (!window.isSecureContext) {
                statusMsg.innerHTML = `<span class="error">❌ Camera requires HTTPS.</span>`;
                return;
            }
            await loadLogo();
            startGeolocation();
            await startCamera('environment');
            updateUI();
        }
        init();

        console.log('📸 Nspira Camera App loaded!');
    </script>
</body>
